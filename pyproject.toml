[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-tb-agent"
version = "0.1.0"
description = "Harbor installed agent that runs DeepSeek Harness (dsh) on Terminal-Bench 2.1"
requires-python = ">=3.12"
dependencies = [
  "harbor==0.25.0",
  "deepseek-harness-sdk==0.1.0rc6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsh_tb_agent = ["minimal.cordis.yml", "effort-plugin.mjs"]
